name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pre-commit hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0

  check:
    name: check
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting and lint
        run: just check

  test:
    name: test
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run unit tests
        run: just test

  matrix:
    name: matrix
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Generate the test matrix
        id: matrix
        run: |
          {
            echo 'matrix<<EOF'
            cargo xtask matrix
            echo EOF
          } >> "$GITHUB_OUTPUT"

  test-suite:
    needs: matrix
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install VM tools
        if: matrix.suite != 'container'
        env:
          BCVK_VERSION: 0.21.0
          BCVK_SHA256: 3135cc59b8971193b49be6cbaee12b789391ac6e6ab5ed3edf17082b03f144dd
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 \
            qemu-utils ovmf virtiofsd systemd-container systemd-journal-remote
          curl -fsSLo "$RUNNER_TEMP/bcvk.tar.gz" \
            "https://github.com/bootc-dev/bcvk/releases/download/v$BCVK_VERSION/bcvk-x86_64-unknown-linux-gnu.tar.gz"
          echo "$BCVK_SHA256  $RUNNER_TEMP/bcvk.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/bcvk.tar.gz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/bcvk-x86_64-unknown-linux-gnu" /usr/local/bin/bcvk

      # Ubuntu only lets root and the kvm group open /dev/kvm and
      # /dev/vhost-vsock.
      - name: Allow access to KVM and vsock
        if: matrix.suite != 'container'
        run: |
          sudo modprobe vhost_vsock
          echo 'KERNEL=="kvm|vhost-vsock", GROUP="kvm", MODE="0666"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --name-match=vhost-vsock

      - name: Log in to GitHub Container Registry
        uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run ${{ matrix.suite }} tests on ${{ matrix.image }}
        env:
          BOOTC_IMAGECTL_TEST_FILESYSTEM: ${{ matrix.filesystem }}
          BOOTC_IMAGECTL_BUILD_OPTIONS: >-
            --cache-from=ghcr.io/${{ github.repository }}/cache-{image}
            ${{ github.event.pull_request.head.repo.fork != true && format('--cache-to=ghcr.io/{0}/cache-{{image}}', github.repository) || '' }}
        run: just test-${{ matrix.suite }} --image ${{ matrix.image }}

      - name: Upload install logs
        if: failure() && matrix.suite == 'install'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}-logs
          path: |
            target/debug/install/console.log
            target/debug/install/vmspawn.log
            target/debug/install/vm.journal
