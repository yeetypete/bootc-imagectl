# package: colord
g colord 989
u colord 989 "colord colour management daemon" /var/lib/colord /usr/sbin/nologin
# package: dbus-system-bus-common
g messagebus 997
u messagebus 997 "System Message Bus" /nonexistent /usr/sbin/nologin
# package: gdm3
g gdm 988
u gdm 988 "Gnome Display Manager" /var/lib/gdm3 /bin/false
# package: openssh-server
u sshd 987:65534 "sshd user" /run/sshd /usr/sbin/nologin
# package: pipewire
g pipewire 990
u pipewire 990 "system user for pipewire" /nonexistent /usr/sbin/nologin
# package: polkitd
g polkitd 991
u polkitd 991 "User for polkitd" / /usr/sbin/nologin
# package: systemd
g systemd-journal 999
g systemd-network 998
u! systemd-network 998 "systemd Network Management" / /usr/sbin/nologin
# package: udev
g input 996
g sgx 995
g clock 994
g kvm 993
g render 992
# package: libsane1
g scanner 101
# package: wpasupplicant
g netdev 102
# package: geoclue-2.0
g geoclue 103
u geoclue 100:103 - /var/lib/geoclue /usr/sbin/nologin
# package: openssh-client
g _ssh 104
# package: tpm-udev
g tss 986
u tss 986 "tss user for tpm2" / /usr/sbin/nologin
