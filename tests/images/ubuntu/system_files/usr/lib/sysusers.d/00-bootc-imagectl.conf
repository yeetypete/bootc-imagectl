# package: openssh-server
u sshd 992:65534 "sshd user" /run/sshd /usr/sbin/nologin
# package: systemd
g systemd-journal 999
g systemd-network 998
u! systemd-network 998 "systemd Network Management" / /usr/sbin/nologin
# package: udev
g input 997
g sgx 996
g clock 995
g kvm 994
g render 993
# package: openssh-client
g _ssh 101
# package: -
g ubuntu 1000
u ubuntu 1000 Ubuntu /home/ubuntu /bin/bash
m ubuntu adm
m ubuntu dialout
m ubuntu cdrom
m ubuntu floppy
m ubuntu sudo
m ubuntu audio
m ubuntu dip
m ubuntu video
m ubuntu plugdev
