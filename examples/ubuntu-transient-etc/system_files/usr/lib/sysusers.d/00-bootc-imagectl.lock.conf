# package: dbus-system-bus-common
g messagebus 997
u messagebus 997 "System Message Bus" /nonexistent /usr/sbin/nologin
# package: openssh-server
u sshd 991:65534 "sshd user" /run/sshd /usr/sbin/nologin
# package: polkitd
g polkitd 990
u polkitd 990 "User for polkitd" / /usr/sbin/nologin
# package: systemd
g systemd-journal 999
g systemd-network 998
u! systemd-network 998 "systemd Network Management" / /usr/sbin/nologin
# package: systemd-resolved
g systemd-resolve 988
u! systemd-resolve 988 "systemd Resolver" / /usr/sbin/nologin
# package: systemd-timesyncd
g systemd-timesync 989
u! systemd-timesync 989 "systemd Time Synchronization" / /usr/sbin/nologin
# package: udev
g input 996
g sgx 995
g clock 994
g kvm 993
g render 992
# package: openssh-client
g _ssh 101
# package: dhcpcd-base
g dhcpcd 987
u! dhcpcd 987 "DHCP Client Daemon" /usr/lib/dhcpcd /bin/false
# package: tpm-udev
g tss 986
u tss 986 "tss user for tpm2" / /usr/sbin/nologin
