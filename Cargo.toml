[package]
name = "bootc-imagectl"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Finalize and install composefs bootc images."
repository = "https://github.com/yeetypete/bootc-imagectl"
license = "MIT"
keywords = ["arch", "bootc", "composefs", "debian", "image"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1"
cap-std-ext = "5"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uzers = { version = "0.12", default-features = false, features = ["cache", "mock"] }

[features]
# Builds the container tests, which finalize the images in tests/images and
# check the result, see `just test-container`.
container = []
# Builds the VM tests, which boot the images, see `just test-vm`.
vm = []

# The container tests, see tests/container/main.rs.
[[test]]
name = "container"
path = "tests/container/main.rs"
required-features = ["container"]

# The VM tests, see tests/vm/main.rs.
[[test]]
name = "vm"
path = "tests/vm/main.rs"
required-features = ["vm"]

[lints.clippy]
dbg_macro = "warn"
exit = "warn"
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
todo = "warn"

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
