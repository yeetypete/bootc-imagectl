# package: systemd
g empower 999
g systemd-oom 998
u systemd-oom 998 "systemd Userspace OOM Killer" / /usr/sbin/nologin
# package: systemd-udev
g systemd-coredump 997
g systemd-timesync 996
u systemd-coredump 997 "systemd Core Dumper" / /usr/sbin/nologin
u systemd-timesync 996 "systemd Time Synchronization" / /usr/sbin/nologin
# package: -
g fedora 1000
u fedora 1000 Fedora /home/fedora /bin/bash
m fedora wheel
